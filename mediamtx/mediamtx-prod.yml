# Carvingsoft CCTV Platform - MediaMTX production configuration
# LIVE STREAMING ONLY - no recording
# Installed to /opt/mediamtx/mediamtx.yml by deploy/install-server.sh

logLevel: info
logDestinations: [stdout]

api: true
apiAddress: 127.0.0.1:9997

# Pull-only setup — disable unused ingest protocols
rtmp: false
srt: false
moq: false

# TCP-only RTSP avoids binding UDP :8000 (RTP)
rtspTransports: [tcp]
rtspAddress: :8554
webrtcAddress: :8889
hlsAddress: :8888

# fmp4 supports H265 (CP Plus main streams). Do NOT use mpegts (H264-only) or lowLatency (cookie/proxy break).
hlsVariant: fmp4
# Remux HLS only while viewers are watching (pairs with sourceOnDemand)
hlsAlwaysRemux: false
hlsSegmentDuration: 2s
# Shared secret for backend HLS proxy (set from backend/.env by deploy/restart-mediamtx.sh)
hlsCDNSecret: ""

webrtcAllowOrigins: ['https://live.carvingsoft.com']

pathDefaults:
  # Pull RTSP only when a viewer requests HLS/WebRTC; close when idle
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 30s
  sourceOnDemandCloseAfter: 30s
  rtspTransport: tcp

paths: {}
